name: Check probe example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  http:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check HTTP states
        run: python probe_smoke.py
      - name: Check regressions
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Python image
        run: docker build -t xnova-probes:local .
